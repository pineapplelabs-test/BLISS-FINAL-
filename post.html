<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>BLISS — Fine Dance Studio & Premium Event Hall</title>
<meta name="description" content="BLISS — Bangalore's premium dance studio and bespoke party hall. A light-filled luxury space for creative movement and celebrations." />

<!-- GEO LOCAL SEO & GENERATIVE ENGINE OPTIMIZATION (GEO) -->
<meta name="geo.region" content="IN-KA" />
<meta name="geo.placename" content="Bengaluru" />
<meta name="geo.position" content="12.973398;77.678621" />
<meta name="ICBM" content="12.973398, 77.678621" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ────────────────────── DESIGN TOKENS ────────────────────── */
  :root {
    --bg: #FFFFFF;
    --bg-alt: #FFFDFD;
    --card-bg: #FFFFFF;
    --text: #1C1B18;
    --text-soft: #5C5752;
    --text-muted: #9E9993;
    --border: #F0EAE5;
    --border-hover: #D90429;
    --primary: #D90429;
    --primary-light: #EF233C;
    --primary-glow: rgba(217, 4, 41, 0.06);
    
    --ff-display: 'Outfit', sans-serif;
    --ff-sans: 'Outfit', sans-serif;
    --ff-mono: 'Space Grotesk', monospace;
    
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    
    --radius: 12px;
    --radius-lg: 24px;
  }

  /* ────────────────────── RESET ────────────────────── */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
    overflow-x: hidden;
  }

  body {
    font-family: var(--ff-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--primary);
    color: white;
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  button, input, select, textarea {
    font-family: inherit;
  }

  /* ────────────────────── TYPOGRAPHY ────────────────────── */
  h1, h2, h3, h4 {
    font-family: var(--ff-display);
    font-weight: 700;
    color: var(--text);
  }

  .heading-xl {
    font-size: clamp(2.6rem, 5.5vw, 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .heading-lg {
    font-size: clamp(2rem, 4vw, 3.2rem);
    line-height: 1.15;
  }

  .label {
    font-family: var(--ff-mono);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--primary);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  
  .label::before {
    content: '';
    width: 24px;
    height: 1.5px;
    background: var(--primary);
  }

  /* ────────────────────── LAYOUT ────────────────────── */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 60px);
  }

  section {
    padding: clamp(60px, 8vw, 100px) 0;
  }
  
  .section-header {
    max-width: 680px;
    margin-bottom: clamp(24px, 4vw, 36px);
  }
  
  .section-header p {
    color: var(--text-soft);
    font-size: 1.05rem;
    font-weight: 300;
    margin-top: 14px;
    line-height: 1.75;
  }

  /* ────────────────────── NAVIGATION ────────────────────── */
  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    padding: 0 clamp(20px, 5vw, 60px);
    transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease), padding 0.4s var(--ease);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .site-nav.scrolled {
    background: #FFFFFF;
    box-shadow: 0 4px 30px rgba(217, 4, 41, 0.05);
    border-bottom: 1px solid rgba(217, 4, 41, 0.08);
  }

  .nav-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 90px;
    transition: height 0.4s var(--ease);
  }

  .site-nav.scrolled .nav-inner {
    height: 72px;
  }

  .brand {
    display: flex;
    align-items: center;
    transition: transform 0.3s var(--ease);
  }

  .brand img {
    height: 48px;
    width: auto;
    display: block;
    transition: height 0.4s var(--ease);
  }

  .site-nav.scrolled .brand img {
    height: 38px;
  }

  .nav-menu {
    display: flex;
    gap: 32px;
    list-style: none;
    align-items: center;
  }

  .nav-menu a {
    text-decoration: none;
    color: var(--text-soft);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.3s var(--ease);
    position: relative;
    padding: 6px 0;
  }

  .nav-menu a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--primary);
    transition: width 0.35s var(--ease-out);
  }

  .nav-menu a:hover {
    color: var(--primary);
  }

  .nav-menu a:hover::after {
    width: 100%;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 30px;
    border-radius: 100px;
    font-family: var(--ff-display);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.4s var(--ease);
    cursor: pointer;
    border: 1.5px solid transparent;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(217, 4, 41, 0.25);
  }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border-color: var(--text);
  }

  .btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-2px);
  }

  /* Mobile Nav Toggle */
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    width: 28px;
    height: 18px;
    position: relative;
    z-index: 110;
  }

  .nav-toggle span {
    display: block;
    width: 100%;
    height: 2px;
    background: var(--text);
    position: absolute;
    left: 0;
    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease), top 0.3s var(--ease);
  }

  .nav-toggle span:nth-child(1) { top: 0; }
  .nav-toggle span:nth-child(2) { top: 8px; }
  .nav-toggle span:nth-child(3) { top: 16px; }

  .nav-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2) { opacity: 0; }
  .nav-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  @media (max-width: 860px) {
    .nav-toggle {
      display: block;
    }

    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100vh;
      background: #FFFFFF;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
      transition: right 0.5s var(--ease-out);
      z-index: 105;
      padding: 40px;
      box-shadow: -10px 0 40px rgba(0,0,0,0.05);
    }

    .nav-menu.open {
      right: 0;
    }
  }

  /* ────────────────────── HERO SECTION ────────────────────── */
  .hero {
    position: relative;
    background: #FFFDFD;
    padding: 20px 0;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 90px);
    margin-top: 90px;
  }

  .hero-header {
    text-align: center;
    max-width: 800px;
    margin: 0 auto 24px;
  }

  .hero-main-title {
    margin-top: 8px;
    margin-bottom: 8px;
  }

  .hero-subtitle {
    font-size: 1.05rem;
    color: var(--text-soft);
    font-weight: 300;
    line-height: 1.6;
  }

  .hero-cards-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 480px));
    gap: 30px;
    max-width: 1080px;
    margin: 0 auto;
    width: 100%;
    justify-content: center;
  }

  .hero-flashcard {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
    display: flex;
    flex-direction: column;
    transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    position: relative;
    height: 100%;
  }

  .hero-flashcard::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s var(--ease-out);
    z-index: 3;
    background: var(--primary);
  }

  .hero-flashcard:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 45px rgba(217, 4, 41, 0.08);
    border-color: var(--primary-light);
  }

  .hero-flashcard:hover::after {
    transform: scaleX(1);
  }

  .hero-card-img {
    height: 180px;
    overflow: hidden;
    position: relative;
    background: #FAF8F5;
  }

  .hero-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 6s var(--ease-out);
  }

  .hero-flashcard:hover .hero-card-img img {
    transform: scale(1.06);
  }

  .hero-card-tag {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 0.72rem;
    font-weight: 600;
    font-family: var(--ff-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--primary);
    color: white;
    padding: 6px 14px;
    border-radius: 100px;
    z-index: 2;
  }

  .hero-card-body {
    padding: 24px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .hero-card-title {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }

  .hero-card-text {
    font-size: 0.9rem;
    color: var(--text-soft);
    font-weight: 300;
    line-height: 1.5;
    margin-bottom: 20px;
    flex-grow: 1;
  }

  .hero-card-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn-card {
    flex: 1;
    min-width: 150px;
    padding: 12px 20px;
    font-size: 0.75rem;
  }

  @media (max-width: 768px) {
    .hero {
      padding: 20px 0;
      margin-top: 72px;
      min-height: calc(100vh - 72px);
    }
    .hero-header {
      margin-bottom: 20px;
    }
    .hero-cards-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .hero-card-img {
      height: 130px;
    }
    .hero-card-body {
      padding: 16px;
    }
    .hero-card-title {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }
    .hero-card-text {
      font-size: 0.82rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .btn-card {
      padding: 8px 12px;
      font-size: 0.7rem;
      min-width: unset;
    }
  }

  @media (max-width: 580px) {
    .hero-cards-grid {
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 320px;
    }
    .hero-card-img {
      height: 110px;
    }
    .hero-card-body {
      padding: 12px 16px;
    }
    .hero-card-text {
      display: none;
    }
  }

  /* ────────────────────── ABOUT SECTION ────────────────────── */
  .about {
    background: #FFFDFD;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(40px, 6vw, 80px);
    align-items: center;
  }

  .about-image {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.03);
    aspect-ratio: 4/3;
    border: 1.5px solid var(--border);
  }

  .about-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .about-text p {
    color: var(--text-soft);
    font-size: 1.05rem;
    font-weight: 300;
    line-height: 1.8;
    margin-top: 20px;
  }
  
  .about-text p strong {
    color: var(--text);
    font-weight: 600;
  }

  .about-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 28px;
    border-top: 1.5px solid var(--border);
    padding-top: 22px;
  }

  .stat-card {
    text-align: left;
  }

  .stat-num {
    font-size: clamp(1.8rem, 3.5vw, 2.5rem);
    font-weight: 800;
    color: var(--primary);
    line-height: 1.1;
  }

  .stat-lbl {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin-top: 4px;
  }

  @media (max-width: 900px) {
    .about-grid {
      grid-template-columns: 1fr;
    }
  }

  /* ────────────────────── DANCE ACADEMY ────────────────────── */
  .academy {
    background: var(--bg);
  }

  .filter-tabs {
    display: flex;
    justify-content: start;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 100px;
    padding: 10px 24px;
    font-family: var(--ff-display);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.3s var(--ease);
  }

  .filter-btn:hover,
  .filter-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* Program cards layout */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 28px;
  }

  .flash-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    transition: all 0.4s var(--ease-out);
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    color: inherit;
  }

  .flash-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--primary);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s var(--ease-out);
    z-index: 3;
  }

  .flash-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 45px rgba(217, 4, 41, 0.08);
    border-color: var(--primary);
  }

  .flash-card:hover::after {
    transform: scaleX(1);
  }

  .card-img-wrap {
    height: 220px;
    width: 100%;
    overflow: hidden;
    position: relative;
    background: #FAF8F5;
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 5s var(--ease);
  }

  .flash-card:hover .card-img-wrap img {
    transform: scale(1.06);
  }

  .card-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 0.72rem;
    font-weight: 600;
    background: white;
    color: var(--primary);
    padding: 6px 14px;
    border-radius: 100px;
    letter-spacing: 0.02em;
    z-index: 2;
    border: 1px solid var(--border);
  }

  .card-content-wrap {
    padding: 28px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .card-category {
    font-family: var(--ff-mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 10px;
  }

  .card-desc {
    font-size: 0.9rem;
    color: var(--text-soft);
    font-weight: 300;
    line-height: 1.65;
    margin-bottom: 20px;
  }

  .card-arrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--primary);
    margin-top: auto;
    transition: all 0.3s var(--ease);
  }

  .flash-card:hover .card-arrow {
    transform: translateX(4px);
    color: var(--primary-light);
  }

  /* ────────────────────── PARTY HALL TEASER ────────────────────── */
  .venue-teaser {
    background: #FAF6EE; /* Champagne gold background for Hall teaser */
    border-top: 1px solid rgba(122, 10, 25, 0.15);
    border-bottom: 1px solid rgba(122, 10, 25, 0.15);
    color: #7A0A19;
  }

  .venue-teaser-inner {
    display: grid;
    grid-template-columns: 1.10fr 0.9fr;
    gap: 50px;
    align-items: center;
  }

  .venue-teaser-text h2 {
    color: #7A0A19;
    margin-top: 16px;
    font-family: var(--ff-display);
    font-weight: 800;
  }
  
  .venue-teaser-text p {
    color: #9E2A2B;
    font-weight: 300;
    line-height: 1.8;
    margin-top: 14px;
  }

  .venue-teaser-img {
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(122, 10, 25, 0.06);
    border: 1.5px solid #EEDDBA;
  }

  .venue-teaser-img img {
    width: 100%;
    height: 380px;
    object-fit: cover;
  }

  @media (max-width: 860px) {
    .venue-teaser-inner {
      grid-template-columns: 1fr;
    }
  }

  /* ────────────────────── BOOKING / CONTACT ────────────────────── */
  .contact {
    background: var(--bg);
  }

  .contact-layout {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: clamp(40px, 6vw, 80px);
    align-items: start;
  }

  .contact-info-panel {
    padding-right: 20px;
  }

  .contact-details {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 28px;
  }

  .contact-row {
    display: flex;
    align-items: start;
    gap: 16px;
  }

  .contact-icon {
    width: 44px;
    height: 44px;
    background: var(--bg-alt);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .contact-icon svg {
    width: 20px;
    height: 20px;
  }

  .contact-text h4 {
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .contact-text p {
    font-size: 0.95rem;
    color: var(--text-soft);
    font-weight: 300;
  }

  /* Form Card styling */
  .form-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: clamp(24px, 4vw, 48px);
    box-shadow: 0 15px 45px rgba(217, 4, 41, 0.04);
  }

  .form-toggle {
    display: flex;
    border-bottom: 2px solid var(--border);
    margin-bottom: 24px;
  }

  .form-toggle-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 14px 10px;
    font-family: var(--ff-display);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    transition: color 0.3s var(--ease);
    text-align: center;
  }

  .form-toggle-btn.active {
    color: var(--primary);
  }

  .form-toggle-btn::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--primary);
    transform: scaleX(0);
    transition: transform 0.4s var(--ease-out);
  }

  .form-toggle-btn.active::after {
    transform: scaleX(1);
  }

  .form-group {

<body>

  <!-- NAV -->
  <nav class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <img src="logo-red.png" alt="BLISS" />
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="dance.html">Dance Studio</a></li>
        <li><a href="party-hall.html">Party Hall</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="https://wa.me/919741573003" target="_blank" class="btn btn-primary" style="color:white; padding: 8px 20px;">Book Now</a></li>
      </ul>
    </div>
  </nav>
  <section class="hero" style="min-height: auto; margin-top: 90px; padding: 60px 0 20px;">
    <div class="container">
      <div class="hero-header" style="max-width: 800px; margin: 0 auto; text-align: left;">
        <span class="label" id="post-date">Loading...</span>
        <h1 class="heading-lg hero-main-title" id="post-title" style="margin-top:20px; margin-bottom: 20px;">Loading Post...</h1>
      </div>
    </div>
  </section>

  <section class="post-content" style="padding: 20px 0 100px;">
    <div class="container" style="max-width: 800px; margin: 0 auto;">
      <div id="post-image" style="margin-bottom: 40px; border-radius: 12px; overflow: hidden;"></div>
      <div id="post-body" style="font-size: 1.1rem; line-height: 1.8; color: var(--text-soft);">
      </div>
    </div>
  </section>

  <script type="module">
    import { createClient } from 'https://esm.sh/@sanity/client'
    
    const client = createClient({
      projectId: 'ba1hmt7m',
      dataset: 'production',
      useCdn: true,
      apiVersion: '2023-05-03',
    })

    function renderPortableText(blocks) {
      if (!blocks || !Array.isArray(blocks)) return '';
      let html = '';
      let inList = false;

      for (const block of blocks) {
        if (block._type === 'image' && block.asset?._ref) {
          if (inList) { html += '</ul>'; inList = false; }
          const cleanRef = block.asset._ref.replace('image-', '').replace('-jpg', '.jpg').replace('-png', '.png').replace('-webp', '.webp');
          html += `<img src="https://cdn.sanity.io/images/ba1hmt7m/production/${cleanRef}" style="width:100%; border-radius:12px; margin:24px 0;" />`;
          continue;
        }

        if (block._type !== 'block' || !block.children) continue;

        const text = block.children.map(c => c.text || '').join('');

        if (block.listItem === 'bullet') {
          if (!inList) { html += '<ul style="margin: 16px 0 24px; padding-left: 24px; line-height: 1.85;">'; inList = true; }
          html += `<li style="margin-bottom: 10px;">${text}</li>`;
          continue;
        } else if (inList) {
          html += '</ul>';
          inList = false;
        }

        if (block.style === 'h2') {
          html += `<h2 style="font-size: 1.8rem; margin: 36px 0 16px; color: var(--text, #111); font-family: var(--ff-serif, serif); line-height: 1.3;">${text}</h2>`;
        } else if (block.style === 'h3') {
          html += `<h3 style="font-size: 1.35rem; margin: 28px 0 12px; color: var(--text, #111); line-height: 1.4;">${text}</h3>`;
        } else {
          html += `<p style="margin-bottom: 20px; line-height: 1.85; font-size: 1.05rem; color: var(--text-soft, #444);">${text}</p>`;
        }
      }
      if (inList) html += '</ul>';
      return html;
    }
    
    async function loadPost() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');
      
      if (!slug) {
        document.getElementById('post-title').innerText = 'Post not found';
        return;
      }
      
      try {
        const post = await client.fetch(`*[_type == "post" && slug.current == "${slug}"][0]{
          title, mainImage{asset->{url}}, publishedAt, body
        }`);
        
        if (!post) {
          document.getElementById('post-title').innerText = 'Post not found';
          return;
        }
        
        document.getElementById('post-title').innerText = post.title;
        document.title = `${post.title} — BLISS Dance Studio & Party Hall Vignan Nagar`;
        document.getElementById('post-date').innerText = new Date(post.publishedAt).toLocaleDateString();
        
        if (post.mainImage?.asset?.url) {
          document.getElementById('post-image').innerHTML = `<img src="${post.mainImage.asset.url}" style="width: 100%; height: auto;" alt="${post.title}" />`;
        }
        
        document.getElementById('post-body').innerHTML = renderPortableText(post.body);

        // Dynamic Schema.org BlogPosting + Geo Entity
        const schema = {
          "@context": "https://schema.org",
          "@type": "BlogPosting",
          "headline": post.title,
          "image": post.mainImage?.asset?.url || "https://www.bliss.ind.in/logo-red.png",
          "datePublished": post.publishedAt,
          "dateModified": post.publishedAt,
          "author": {
            "@type": "Person",
            "name": "Sandeep",
            "jobTitle": "Studio Lead & Founder",
            "url": "https://www.bliss.ind.in/"
          },
          "publisher": {
            "@type": "Organization",
            "name": "BLISS Dance Studio & Party Hall",
            "url": "https://www.bliss.ind.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.bliss.ind.in/logo-red.png"
            }
          },
          "contentLocation": {
            "@type": "Place",
            "name": "BLISS Dance Studio & Party Hall",
            "geo": {
              "@type": "GeoCoordinates",
              "latitude": 12.973398,
              "longitude": 77.678621
            },
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "2nd Floor, Keerthi Mansion, 13/14, Vignan Nagar Main Rd, opposite Hayagriva School",
              "addressLocality": "Malleshpalya, Doddanekkundi, Bengaluru",
              "addressRegion": "Karnataka",
              "postalCode": "560075",
              "addressCountry": "IN"
            }
          }
        };
        const scriptEl = document.createElement('script');
        scriptEl.type = 'application/ld+json';
        scriptEl.textContent = JSON.stringify(schema);
        document.head.appendChild(scriptEl);
        
      } catch (err) {
        console.error(err);
        document.getElementById('post-title').innerText = 'Error loading post';
      }
    }
    
    loadPost();

    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');
    if(navToggle && navMenu) {
      navToggle.addEventListener('click', () => {
        navToggle.classList.toggle('open');
        navMenu.classList.toggle('active');
      });
    }
  </script>
